# Read ONCE by `hosh-deploy register livecode` on the box (box standard, Decision #16), which validates
# the compose hardening and pins the result in /etc/hosh-deploy/apps/livecode.conf. Changing this file
# in the repo changes nothing on the box until someone re-registers there.
SERVICE=livecode
IMAGE_REPO=ghcr.io/pazka/livecode
IMAGE_VAR=APP_IMAGE
ENV_FILE=livecode.env
HOST=code.hosh.it
BIND=127.0.0.1:9134
HEALTH=/healthz
# Optional capability smoke run INSIDE the container after each deploy (non-zero ⇒ auto-rollback).
# Run as a plain argv (split on spaces, NO shell: no pipes, quotes, globs or $VARS), so it works in distroless images.
# e.g. POST_DEPLOY=python scripts/smoke.py http://127.0.0.1:8000
POST_DEPLOY=
REPO=pazka/livecode
